<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Моя видеополка</title>
<style>
  :root{
    --bg:#0e1116; --bg2:#151a22; --card:#171d26; --line:#25303d;
    --txt:#e6edf5; --dim:#8b9bb0; --acc:#ff8a3d; --acc2:#4fb3ff; --ok:#3ddc97; --tg:#7d9dff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:40px;
  }
  a{color:inherit;text-decoration:none}

  header{
    position:sticky; top:0; z-index:20;
    background:rgba(14,17,22,.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:13px 16px 9px;
  }
  .brand{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
  .brand b{font-size:17px;letter-spacing:.2px}
  .brand b i{color:var(--acc);font-style:normal}
  .brand span{font-size:12px;color:var(--dim)}

  .search{position:relative}
  .search input{
    width:100%; padding:11px 14px 11px 38px; background:var(--bg2);
    border:1px solid var(--line); border-radius:11px; color:var(--txt);
    font-size:15px; outline:none;
  }
  .search input:focus{border-color:var(--acc2)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}

  .chips{display:flex;gap:7px;overflow-x:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; padding:6px 13px; border-radius:20px; font-size:13px;
    background:var(--bg2); border:1px solid var(--line); color:var(--dim);
    cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .chip.on{background:var(--acc); border-color:var(--acc); color:#12161c; font-weight:600}
  .chip.on.src-grp{background:var(--tg); border-color:var(--tg)}
  .chip.sm{font-size:12px;padding:5px 11px}

  .meta{font-size:12px;color:var(--dim);padding:12px 16px 4px}
  .meta b{color:var(--txt)}

  main{display:grid;grid-template-columns:1fr;gap:14px;padding:10px 16px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.15s}
  .card:hover{border-color:#31404f}
  .thumb{position:relative;display:block;aspect-ratio:16/9;background:#0a0d11}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.5))}
  .thumb .play i{width:46px;height:46px;border-radius:50%;background:rgba(255,138,61,.92);
    display:flex;align-items:center;justify-content:center}
  .thumb .play i:after{content:'';border-style:solid;border-width:8px 0 8px 13px;
    border-color:transparent transparent transparent #12161c;margin-left:3px}
  .badge{
    position:absolute;top:9px;left:9px;font-size:11px;padding:3px 9px;border-radius:8px;
    background:rgba(10,13,17,.85);border:1px solid rgba(255,255,255,.14);color:var(--dim);
  }
  .badge.hn{color:var(--acc);border-color:rgba(255,138,61,.45)}
  .badge.grp{color:var(--tg);border-color:rgba(125,157,255,.45)}
  .badge b{color:var(--txt)}

  .body{padding:13px 14px 15px}
  .ttl{font-size:16px;font-weight:600;line-height:1.32;margin:0 0 5px}
  .chan{font-size:13px;color:var(--acc2);margin-bottom:9px}
  .sum{font-size:13.5px;color:#b9c7d6;margin:0 0 11px}
  .why{background:#10161d;border-left:2px solid var(--ok);border-radius:0 8px 8px 0;
    padding:9px 12px;margin-bottom:11px;font-size:13px;color:#c7d4e2}
  .why b{display:block;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
  .tag{font-size:11.5px;color:var(--dim);background:#10161d;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .quote{font-size:12.5px;color:var(--dim);font-style:italic;margin:0 0 12px}
  .quote a{color:var(--acc2);border-bottom:1px dotted rgba(79,179,255,.5)}
  .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .pill{font-size:11.5px;padding:3px 9px;border-radius:6px;background:#10161d;border:1px solid var(--line);color:#a9b8c9}
  .pill.t{color:var(--acc);border-color:rgba(255,138,61,.35)}
  .pill.g{color:var(--tg);border-color:rgba(125,157,255,.35)}
  .go{margin-left:auto;font-size:13px;font-weight:600;color:#12161c;background:var(--acc);
    padding:8px 15px;border-radius:9px;white-space:nowrap}
  .go:hover{background:#ffa05f}
  .empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px}

  @media(min-width:760px){
    main{grid-template-columns:1fr 1fr;max-width:1200px;margin:0 auto}
    header>div{max-width:1200px;margin:0 auto}
    .meta{max-width:1200px;margin:0 auto}
  }
  @media(min-width:1150px){ main{grid-template-columns:repeat(3,1fr)} }

  /* плеер */
  .modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(4,6,9,.9);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    align-items:center;justify-content:center;padding:16px}
  .modal.on{display:flex}
  .modal .box{width:min(1100px,100%);background:var(--card);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .modal .frame{position:relative;aspect-ratio:16/9;background:#000}
  .modal .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .modal .bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
  .modal .bar .t{flex:1;min-width:0}
  .modal .bar .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .modal .bar .t span{font-size:12px;color:var(--dim)}
  .modal .bar a,.modal .bar button{font-size:12px;color:#a9b8c9;background:#10161d;
    border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
  .modal .bar a:hover,.modal .bar button:hover{color:var(--txt);border-color:#31404f}
  .modal .x{font-size:16px;line-height:1;padding:7px 11px !important}
  @media(max-width:600px){
    .modal{padding:0}
    .modal .box{border-radius:0;border:0}
    .modal .bar .t span{display:none}
  }
  .modal .fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;padding:22px;text-align:center;background:#0a0d11}
  .modal .fallback.on{display:flex}
  .modal .fallback p{margin:0;color:var(--dim);font-size:13px;max-width:520px;line-height:1.45}
  .modal .fallback b{color:var(--txt);font-size:15px}
  .modal .fallback .yt{font-size:13px;font-weight:600;color:#12161c;background:var(--acc);
    padding:10px 18px;border-radius:9px}
  .fnote a{color:var(--acc2)}
  .fnote{max-width:1200px;margin:14px auto 0;padding:10px 14px;border-radius:10px;
    background:#10161d;border:1px solid var(--line);color:var(--dim);font-size:12px;text-align:center}
  footer{text-align:center;color:#5a6a7d;font-size:11.5px;padding:18px 16px 0;max-width:1200px;margin:0 auto}
</style>

const SRCN = {hn:'Hacker News', grp:'Супергруппа'};
const topics = [...new Set(DATA.map(d=>d.theme))].sort((a,b)=>a.localeCompare(b,'ru'));
let fSrc='Все', fTopic='Все', query='';

function chips(el, items, cb, cls){
  el.innerHTML = items.map((t,i)=>
    `<button class="chip ${i===0?'on':''}${cls||''}" data-v="${t}">${t}</button>`
  ).join('');
  el.onclick = e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    [...el.children].forEach(c=>c.classList.remove('on'));
    b.classList.add('on'); cb(b.dataset.v);
  };
}

function topicsFor(src){
  const set=[...new Set(DATA.filter(d=>src==='Все'||d.src===src).map(d=>d.theme))];
  return set.sort((a,b)=>a.localeCompare(b,'ru'));
}

chips(document.getElementById('sources'), ['Все','Hacker News','Супергруппа'], v=>{
  fSrc = v==='Hacker News' ? 'hn' : v==='Супергруппа' ? 'grp' : 'Все';
  fTopic='Все';
  chips(document.getElementById('topics'), ['Все', ...topicsFor(fSrc)], t=>{fTopic=t; draw();}, ' sm');
  draw();
});
chips(document.getElementById('topics'), ['Все', ...topicsFor('Все')], t=>{fTopic=t; draw();}, ' sm');

document.getElementById('q').oninput = e=>{query=e.target.value.toLowerCase().trim(); draw();};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function card(d,i){
  const badge = d.src==='hn'
    ? `<span class="badge hn">HN · <b>${d.score.toFixed(1)}</b></span>`
    : `<span class="badge grp">TG · <b>${esc(d.date.slice(5))}</b></span>`;
  const why = d.why ? `<div class="why"><b>Почему советуют</b>${esc(d.why)}</div>` : '';
  const sum = d.summary ? `<p class="sum">${esc(d.summary)}</p>` : '';
  const tags = d.tags && d.tags.length
    ? `<div class="tags">${d.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>` : '';
  const quote = d.quote
    ? `<p class="quote">«${esc(d.quote.text)}» — <a href="${d.quote.link}" target="_blank" rel="noopener">HN, ${d.quote.year}</a></p>` : '';
  const pills = [
    d.src==='hn'
      ? `<span class="pill t">${esc(d.theme)}</span><span class="pill">${esc(d.level)}</span><span class="pill">${esc(d.type)}</span><span class="pill">${d.recs} рекоменд. · ${d.years}</span>`
      : `<span class="pill g">${esc(d.theme)}</span><span class="pill">${esc(d.date)}</span>`
        + (d.post ? `<a class="pill" href="${d.post}" target="_blank" rel="noopener">пост в группе ↗</a>` : '')
  ].join('');
  return `<article class="card">
    <a class="thumb" href="${d.url}" data-play="${d.vid}" target="_blank" rel="noopener">
      <img src="https://i.ytimg.com/vi/${d.vid}/mqdefault.jpg" alt="" loading="lazy">
      <span class="play"><i></i></span>${badge}
    </a>
    <div class="body">
      <h2 class="ttl">${esc(d.title)}</h2>
      <div class="chan">${esc(d.channel)}</div>
      ${sum}${why}${tags}${quote}
      <div class="row">${pills}<a class="go" href="${d.url}" data-play="${d.vid}" target="_blank" rel="noopener">Смотреть</a></div>
    </div>
  </article>`;
}

const modal = document.getElementById('modal');
const frame = document.getElementById('frame');
const fallback = document.getElementById('fallback');
const FROM_FILE = location.protocol === 'file:';
const EMBED_HOST = 'https://www.youtube-nocookie.com/embed/';

function embedURL(vid){
  let u = EMBED_HOST + encodeURIComponent(vid) + '?rel=0&autoplay=1&modestbranding=1&playsinline=1&enablejsapi=1';
  if(!FROM_FILE) u += '&origin=' + encodeURIComponent(location.origin);
  return u;
}

function showFallback(vid, reason){
  const d = DATA.find(x=>x.vid===vid) || {};
  document.getElementById('fbtitle').textContent = reason === 'file'
    ? 'Встроенный плеер недоступен в локальном файле'
    : 'Автор запретил встраивание этого ролика';
  document.getElementById('fbtext').innerHTML = reason === 'file'
    ? 'YouTube разрешает встраивание только страницам, открытым по ссылке (http), а не файлом с диска. '
      + 'Ролик откроется на YouTube в новой вкладке. Скажи — и я выложу полку по ссылке, тогда видео будет играть прямо здесь.'
    : 'Некоторые каналы отключают показ на сторонних сайтах. Ролик откроется на YouTube.';
  document.getElementById('fblink').href = 'https://www.youtube.com/watch?v=' + vid;
  fallback.classList.add('on');
}

function openPlayer(vid){
  const d = DATA.find(x=>x.vid===vid);
  if(!d) return;
  document.getElementById('mtitle').textContent = d.title || 'Без названия';
  document.getElementById('mchan').textContent = d.channel || '';
  document.getElementById('myt').href = 'https://www.youtube.com/watch?v=' + vid;
  fallback.classList.remove('on');
  frame.querySelectorAll('iframe').forEach(f=>f.remove());
  modal.classList.add('on');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  if(FROM_FILE){ showFallback(vid, 'file'); return; }
  const f = document.createElement('iframe');
  f.src = embedURL(vid);
  f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.allowFullscreen = true;
  frame.insertBefore(f, fallback);
  modal.dataset.vid = vid;
}

// YouTube сам сообщает, что ролик нельзя встроить (101/150/153) — тогда показываем кнопку на YouTube
window.addEventListener('message', e=>{
  if(!/youtube(-nocookie)?\.com$/.test((()=>{ try{ return new URL(e.origin).hostname.replace(/^www\./,''); }catch(_){ return ''; } })())) return;
  let msg = e.data;
  if(typeof msg === 'string'){ try { msg = JSON.parse(msg); } catch(_) { return; } }
  if(!msg || msg.event !== 'onError') return;
  const code = Number(msg.info);
  if([101,150,153,2,5].includes(code) && modal.classList.contains('on')){
    showFallback(modal.dataset.vid, code === 153 ? 'file' : 'denied');
  }
});

function closePlayer(){
  modal.classList.remove('on');
  modal.setAttribute('aria-hidden','true');
  frame.querySelectorAll('iframe').forEach(f=>f.remove());
  fallback.classList.remove('on');
  document.body.style.overflow = '';
}
document.getElementById('mclose').onclick = closePlayer;
modal.addEventListener('click', e=>{ if(e.target === modal) closePlayer(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && modal.classList.contains('on')) closePlayer(); });
document.getElementById('grid').addEventListener('click', e=>{
  const a = e.target.closest('[data-play]');
  if(!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
  e.preventDefault();
  openPlayer(a.dataset.play);
});
if(FROM_FILE){
  const note = document.createElement('div');
  note.className = 'fnote';
  note.innerHTML = 'Файл открыт с диска, а YouTube встраивает видео только страницам по ссылке — '
    + 'поэтому ролики открываются на YouTube. Нужно, чтобы играло здесь? Скажи, выложу полку по ссылке.';
  document.querySelector('footer').after(note);
}

function draw(){
  const list = DATA.filter(d=>{
    if(fSrc!=='Все' && d.src!==fSrc) return false;
    if(fTopic!=='Все' && d.theme!==fTopic) return false;
    if(query){
      const hay=(d.title+' '+d.channel+' '+d.summary+' '+d.why+' '+d.theme+' '+(d.tags||[]).join(' ')).toLowerCase();
      if(!hay.includes(query)) return false;
    }
    return true;
  });
  const nh=list.filter(d=>d.src==='hn').length, ng=list.length-nh;
  document.getElementById('cnt').textContent = DATA.length+' роликов';
  document.getElementById('meta').innerHTML = list.length===DATA.length
    ? `<b>${list.length}</b> роликов · ${DATA.filter(d=>d.src==='hn').length} из HN, ${DATA.filter(d=>d.src==='grp').length} из группы`
    : `<b>${list.length}</b> из ${DATA.length} · HN ${nh}, группа ${ng}`;
  const grid=document.getElementById('grid');
  if(!list.length){ grid.innerHTML='<div class="empty">Ничего не нашлось 🤷</div>'; return; }
  grid.innerHTML=list.map(card).join('');
}
draw();
</script>
